<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cihan University–Duhok Assistant</title>
<style>
:root{--g:#2f6b3a;--y:#f5b82e;--card:rgba(255,255,255,.95);--tx:#1d2a22;--mu:#5c6b62;--bd:#d5ddd7;--in:#fff;--bot:#eef3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(24,34,28,.95);--tx:#e8efe9;--mu:#9db0a3;--bd:#34463a;--in:#1c2a21;--bot:#243a2b}}
:root[data-theme="dark"]{--card:rgba(24,34,28,.95);--tx:#e8efe9;--mu:#9db0a3;--bd:#34463a;--in:#1c2a21;--bot:#243a2b}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--tx);background:linear-gradient(160deg,#142a1c,#20402a 55%,#183528) fixed;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff}
header img{width:48px;height:48px;border-radius:50%;background:#fff}
header h1{font-size:16px;margin:0}header p{margin:0;font-size:12px;opacity:.85}.sp{flex:1}
select,input,button{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
main{flex:1;min-height:0;max-width:760px;width:100%;margin:0 auto;padding:0 10px 10px;display:flex;flex-direction:column}
#log{flex:1;overflow-y:auto;background:var(--card);border-radius:14px 14px 0 0;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}.me{background:var(--g);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
html[dir=rtl] .bot{border-radius:14px 14px 14px 4px}
.hand{border-inline-start:4px solid var(--y)}.mu{color:var(--mu);font-size:12.5px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-top:1px solid var(--bd)}
#chips button{flex:0 0 auto;font-size:13px;border-radius:99px;cursor:pointer}
#att{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 0;background:var(--card)}#att:empty{display:none}
.at{display:flex;align-items:center;gap:6px;background:var(--bot);border:1px solid var(--bd);border-radius:10px;padding:3px 6px;font-size:12.5px;max-width:200px}.at img{width:30px;height:30px;object-fit:cover;border-radius:6px}.at span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.at button{padding:0 6px;border-radius:50%;line-height:1.4;cursor:pointer}
.m img.th{display:block;max-width:180px;max-height:140px;border-radius:8px;margin-bottom:4px}.fl{display:inline-block;background:rgba(0,0,0,.15);border-radius:8px;padding:1px 8px;font-size:12.5px;margin:0 4px 4px 0}
#clip{flex:0 0 auto;cursor:pointer;font-size:18px;line-height:1;padding:8px 11px}
form{display:flex;gap:8px;padding:10px;background:var(--card);border-radius:0 0 14px 14px}
form input{flex:1;min-width:0}form button{background:var(--g);color:#fff;border:0;font-weight:600;cursor:pointer}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mu);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

{id:"about",k:/about|who are|what is cihan|university|عن الجامعة|ما هي|جامعة جيهان|دەربارە|زانکۆ/i,en:"Cihan University–Duhok is the Duhok campus of Cihan University, the first private, English-language university in the Kurdistan Region. The university also has campuses in Erbil and Sulaimani.",ar:"جامعة جيهان–دهوك هي فرع دهوك من جامعة جيهان، أول جامعة خاصة تدرّس بالإنجليزية في إقليم كردستان. وللجامعة فروع أخرى في أربيل والسليمانية.",ku:"زانکۆی جیهان–دهۆک لقی دهۆکی زانکۆی جیهانە، یەکەم زانکۆی تایبەتی ئینگلیزی-زمان لە هەرێمی کوردستان. زانکۆکە لە هەولێر و سلێمانیش لقی هەیە."},
{id:"depts",k:/department|major|program|study|college|faculty|subject|nursing|pharmacy|law|بسم|قسم|أقسام|تخصص|كلية|بەش|بەشەکان|کۆلێژ/i,en:"Departments at Cihan Duhok include: General Education (Psychology, English), Business Administration, Accounting, Computer Sciences, English Language, Law, Clinical Biochemistry, Medical Microbiology, Medical Laboratory, Anesthesiology, Nursing, Pharmacy and Radiology.",ar:"تشمل أقسام جيهان دهوك: التربية العامة (علم النفس، الإنجليزية)، إدارة الأعمال، المحاسبة، علوم الحاسوب، اللغة الإنجليزية، القانون، الكيمياء الحياتية السريرية، الأحياء المجهرية الطبية، المختبرات الطبية، التخدير، التمريض، الصيدلة والأشعة.",ku:"بەشەکانی جیهان دهۆک: پەروەردەی گشتی (دەروونزانی، ئینگلیزی)، بەڕێوەبردنی کار، ژمێریاری، زانستی کۆمپیوتەر، زمانی ئینگلیزی، یاسا، بایۆکیمیای کلینیکی، مایکرۆبایۆلۆجی پزیشکی، تاقیگەی پزیشکی، بێهۆشکردن، پەرستاری، دەرمانسازی و ڕادیۆلۆجی."},
{id:"lang",k:/language of|english|arabic|taught|semester|system|لغة|التدريس|فصل|زمان|وەرزی/i,en:"Teaching is in English, except Law (Arabic). The academic year runs on a two-semester system, with an intensive English course available.",ar:"التدريس بالإنجليزية عدا القانون (بالعربية). النظام الدراسي فصلان في السنة، مع دورة مكثفة للغة الإنجليزية.",ku:"خوێندن بە ئینگلیزییە جگە لە یاسا (بە عەرەبی). ساڵی خوێندن دوو وەرزە و خولێکی چڕی ئینگلیزی هەیە."},
{id:"accr",k:/accredit|recogni|ministry|valid|degree|معتمد|اعتراف|وزارة|شهادة|ماف|دان پێدانان|وەزارەت|بڕوانامە/i,en:"Cihan University is accredited by the Kurdistan Ministry of Higher Education and Scientific Research, recognised by the Iraqi Ministry (decision 4632, 6/7/2017), and is a member of the Association of Arab Universities.",ar:"جامعة جيهان معتمدة من وزارة التعليم العالي في إقليم كردستان، ومعترف بها من الوزارة العراقية (القرار 4632 بتاريخ 6/7/2017)، وعضو في اتحاد الجامعات العربية.",ku:"زانکۆی جیهان بە ڕەسمی لەلایەن وەزارەتی خوێندنی بالای هەرێم دانی پێدانراوە، وەزارەتی عیراقیش (بڕیاری 4632، 2017/7/6) و ئەندامی یەکێتی زانکۆ عەرەبییەکانە."},
{id:"where",k:/where|location|address|map|find you|road|street|عنوان|موقع|أين|اين|شارع|ناونیشان|شوێن|کوێ/i,en:"A third-party listing places Cihan University–Duhok on Hawshki Street, Duhok. Please confirm the exact address with the university before visiting.",ar:"يذكر أحد الأدلة الخارجية أن جيهان–دهوك في شارع هوشكي، دهوك. يُرجى التأكد من العنوان الدقيق مع الجامعة قبل الزيارة.",ku:"لیستێکی لایەنی سێیەم زانکۆی جیهان–دهۆک لە شەقامی هەوشکی، دهۆک دەنووسێت. تکایە پێش سەردان ناونیشانی ورد دڵنیا بکەرەوە."},
{id:"contact",k:/contact|phone|call|number|email us|website|site|هاتف|اتصال|رقم|موقع الجامعة|تەلەفۆن|پەیوەندی|ژمارە/i,en:"Official site: duhokcihan.edu.krd (check it is reachable). A third-party listing shows +964 750 188 2805 for the Duhok campus; verify before relying on it. For a specific request, tell me what you need and I will point you to the right unit.",ar:"الموقع الرسمي: duhokcihan.edu.krd (تحقق من عمله). يذكر دليل خارجي الرقم 2805 188 750 964+ لفرع دهوك؛ تحقق منه قبل الاعتماد عليه. لطلب محدد أخبرني بما تحتاج وسأوجهك للوحدة المناسبة.",ku:"ماڵپەڕی فەرمی: duhokcihan.edu.krd (دڵنیابەرەوە کار دەکات). لیستێکی دەرەکی ژمارە +964 750 188 2805 بۆ دهۆک دەنووسێت؛ پێش پشتبەستن دڵنیا بکەرەوە. بۆ داواکاری دیاریکراو پێم بڵێ و بۆ یەکەی گونجاو ڕێنماییت دەکەم."},
{id:"admit",k:/admission|apply|enrol|enroll|register for|entrance|requirement|international|قبول|تقديم|التقديم|امتحان القبول|وةرگرتن|وەرگرتن|دابەزاندن|داواکاری/i,en:"Admission is selective and based on entrance requirements, and international applicants may apply. I don't have verified dates, required documents or quotas, so please ask the Registration Directorate.",ar:"القبول انتقائي بحسب شروط القبول، ويمكن للطلبة الدوليين التقديم. لا تتوفر لدي مواعيد أو وثائق أو طاقات استيعابية مؤكدة، يُرجى مراجعة مديرية التسجيل.",ku:"وەرگرتن هەڵبژاردەییە بەپێی مەرجەکانی وەرگرتن و خوێندکاری نێودەوڵەتیش دەتوانن داواکاری بدەن. بەروار و بەڵگەنامە و کۆتای پشتڕاستکراوەم نییە، تکایە بپرسە لە بەڕێوەبەرایەتی تۆمارکردن.",u:"Registration"},
{id:"fees",k:/fee|tuition|cost|price|installment|pay|refund|receipt|رسوم|قسط|دفع|كلفة|تكلفة|إيصال|پارە|قیست|نرخ|وەسڵ/i,en:"I don't have verified fee amounts, installment plans or refund rules, so I won't guess. Fees, installments, receipts and financial holds are handled by the Finance / Registration Directorate.",ar:"لا أملك مبالغ رسوم أو خطط تقسيط أو شروط استرجاع مؤكدة ولن أخمّن. الرسوم والأقساط والإيصالات والحجز المالي من اختصاص المديرية المالية / التسجيل.",ku:"بڕی پارەی خوێندن و قیست و ڕێسای گەڕاندنەوەی پشتڕاستکراوم نییە و گومان ناکەم. پارە و قیست و وەسڵ و بلۆکی دارایی کاری بەڕێوەبەرایەتی دارایی / تۆمارکردنە.",u:"Finance"},
{id:"ict",k:/wifi|wi-fi|moodle|email|password|login|internet|network|software|lab computer|واي|مودل|بريد|كلمة المرور|شبكة|وای|مۆودڵ|ئیمەیڵ|پاسۆرد/i,en:"For Wi-Fi, Moodle, university email, passwords and lab computers, the ICT Unit Support team handles it. Tell them your university ID and what error you see.",ar:"مشاكل الواي فاي ومودل والبريد الجامعي وكلمات المرور وحواسيب المختبر تتولاها وحدة دعم تكنولوجيا المعلومات. زوّدهم برقمك الجامعي ونص الخطأ.",ku:"کێشەی وای فای و مۆودڵ و ئیمەیڵی زانکۆ و پاسۆرد و کۆمپیوتەری تاقیگە لای یەکەی پشتگیری ICT چارەسەر دەکرێت. ژمارەی زانکۆیی و هەڵەکە پێیان بڵێ.",u:"ICT"},
{id:"lib",k:/library|book|borrow|journal|thesis|database|repository|مكتب|كتاب|استعارة|بحث|کتێبخانە|کتێب|توێژینەوە/i,en:"The campus has a library. For borrowing or renewing books, research databases, journals and thesis repository help, contact Library & E-Resources.",ar:"في الحرم الجامعي مكتبة. للاستعارة والتجديد وقواعد البيانات والمجلات ومستودع الرسائل تواصل مع المكتبة والمصادر الإلكترونية.",ku:"لە کامپەسەکە کتێبخانە هەیە. بۆ خواستن و نوێکردنەوەی کتێب و داتابەیس و گۆڤار و ڕیپۆزیتۆری تێزەکان پەیوەندی بە کتێبخانەوە بکە.",u:"Library"},
{id:"acad",k:/course|module|grade|transcript|credit|bologna|advisor|graduat|clearance|project|schedule|intern|مواد|درجات|كشف|تخرج|جدول|وانە|نمرە|کشف|دەرچوون|خشتە/i,en:"Course/module registration, schedules, transcripts and grade corrections, Bologna credits, graduation clearance and project supervision go through Bologna Process / Academic Advising.",ar:"تسجيل المواد والجداول وكشوف الدرجات وتصحيحها وساعات بولونيا وإخلاء الطرف للتخرج والإشراف على المشاريع عبر عملية بولونيا / الإرشاد الأكاديمي.",ku:"تۆمارکردنی ماددە و خشتە و کشفی نمرە و ڕاستکردنەوەی نمرە و کرێدیتی بۆلۆنیا و پاککردنەوەی دەرچوون و سەرپەرشتی پڕۆژە لە ڕێگەی پڕۆسەی بۆلۆنیا / ڕاوێژکاری ئەکادیمییەوەیە.",u:"Registration"},

const S={en:{h1:"Cihan University–Duhok Assistant",h2:"Ask about the university, services and procedures",ph:"Ask a question…",go:"Send",att:"Attach a photo or file",wnone:"The AI helper isn\'t available right now, so I can\'t read your file. Please describe the problem in text instead.",wdeny:"Permission for Claude was declined. Reload the page and tap Allow when asked, then attach your file again.",wrate:"Too many requests at once. Please wait a minute and try again.",wnoimg:"This view of the page can't send photos. Try opening it in the Claude app or on claude.ai, or send a text file instead.",wfail:"Claude could not read the file (error: ",noatt:"I could not read that file type. Please attach a photo (JPG/PNG) or a text file (TXT, CSV, JSON, MD).",attoff:"Attachments need Claude to be available in this view, so I can't read your file right now. Please describe the problem in text instead.",attbig:"File too large: ",hi:"Hello! I'm the Cihan University–Duhok assistant. Ask me about departments, services, ICT, library, fees or academic procedures — in English, Arabic or Kurdish.",hand:"For this, please contact: ",none:"I don't have a verified answer for that, so I won't guess. ",err:"Sorry, something went wrong. Please try again.",chips:["How many departments?","How do I pay fees?","Scholarships","Exam schedule conflict","Course missing in Moodle","Cannot register for a module","Library e-resources","Campus maintenance"]},
ar:{h1:"مساعد جامعة جيهان–دهوك",h2:"اسأل عن الجامعة والخدمات والإجراءات",ph:"اكتب سؤالك…",go:"إرسال",att:"إرفاق صورة أو ملف",wnone:"المساعد الذكي غير متاح الآن، لذلك لا أستطيع قراءة ملفك. يرجى وصف المشكلة كتابةً.",wdeny:"تم رفض إذن Claude. أعد تحميل الصفحة واضغط سماح عند السؤال، ثم أرفق ملفك مجدداً.",wrate:"طلبات كثيرة دفعة واحدة. انتظر دقيقة ثم حاول مجدداً.",wnoimg:"هذه الصفحة لا تستطيع إرسال الصور هنا. جرّب فتحها في تطبيق Claude أو claude.ai، أو أرسل ملفاً نصياً.",wfail:"تعذّرت قراءة الملف (الخطأ: ",noatt:"لا أستطيع قراءة هذا النوع من الملفات. أرفق صورة (JPG/PNG) أو ملفاً نصياً (TXT, CSV, JSON, MD).",attoff:"المرفقات تحتاج إلى توفر Claude في هذه الصفحة، لذلك لا أستطيع قراءة ملفك الآن. يرجى وصف المشكلة كتابةً.",attbig:"الملف كبير جداً: ",hi:"مرحباً! أنا مساعد جامعة جيهان–دهوك. اسألني عن الأقسام والخدمات وتقنية المعلومات والمكتبة والرسوم والإجراءات الأكاديمية — بالعربية أو الإنجليزية أو الكردية.",hand:"لهذا الأمر يرجى التواصل مع: ",none:"لا تتوفر لدي إجابة مؤكدة على ذلك ولن أخمّن. ",err:"عذراً، حدث خطأ. حاول مرة أخرى.",chips:["ما هي الأقسام؟","الواي فاي أو مودل لا يعمل","كيف أدفع الرسوم؟","أين موقع الجامعة؟","تصحيح كشف الدرجات"]},
ku:{h1:"یاریدەدەری زانکۆی جیهان–دهۆک",h2:"دەربارەی زانکۆ و خزمەتگوزاری و ڕێکارەکان بپرسە",ph:"پرسیارەکەت بنووسە…",go:"ناردن",att:"وێنە یان فایل هاوپێچ بکە",wnone:"یاریدەدەری زیرەک ئێستا بەردەست نییە، بۆیە ناتوانم فایلەکەت بخوێنمەوە. تکایە کێشەکە بە نووسین باس بکە.",wdeny:"مۆڵەتی Claude ڕەتکرایەوە. پەڕەکە نوێ بکەرەوە و کاتێک پرسیار دەکرێت ڕێگە بدە، پاشان فایلەکە دووبارە هاوپێچ بکە.",wrate:"داواکاری زۆر پێکەوە. تکایە خولەکێک چاوەڕێ بکە و دووبارە هەوڵ بدەرەوە.",wnoimg:"ئەم پەڕەیە ناتوانێت وێنە بنێرێت. لە ئەپی Claude یان claude.ai بیکەرەوە، یان فایلی دەق بنێرە.",wfail:"نەتوانرا فایلەکە بخوێنرێتەوە (هەڵە: ",noatt:"ناتوانم ئەم جۆرە فایلە بخوێنمەوە. تکایە وێنە (JPG/PNG) یان فایلی دەق (TXT, CSV, JSON, MD) هاوپێچ بکە.",attoff:"هاوپێچەکان پێویستیان بە بەردەستبوونی Claude هەیە لەم پەڕەیە، بۆیە ئێستا ناتوانم فایلەکەت بخوێنمەوە. تکایە کێشەکە بە نووسین باس بکە.",attbig:"فایلەکە زۆر گەورەیە: ",hi:"سڵاو! من یاریدەدەری زانکۆی جیهان–دهۆکم. دەربارەی بەشەکان و خزمەتگوزارییەکان و ICT و کتێبخانە و پارە و ڕێکارە ئەکادیمییەکان بپرسە — بە ئینگلیزی و عەرەبی و کوردی.",hand:"بۆ ئەمە تکایە پەیوەندی بکە بە: ",none:"وەڵامێکی پشتڕاستکراوم بۆ ئەوە نییە و گومان ناکەم. ",err:"ببورە، هەڵەیەک ڕوویدا. دووبارە هەوڵ بدەرەوە.",chips:["چ بەشێک هەیە؟","وای فای یان مۆودڵ کار ناکات","چۆن پارە بدەم؟","کامپەس لە کوێیە؟","ڕاستکردنەوەی کشفی نمرە"]}};

function unitFor(q){for(const u in ROUTE)if(ROUTE[u].test(q))return u;return null}
const qn=x=>x.replace(/[\u200c-\u200f\u0640\u064B-\u065F\u0670]/g,'').replace(/ك/g,'ک').replace(/[يى]/g,'ی').replace(/ھ/g,'ه');
function local(q){const qs=[q,qn(q)];let best=null,n=0;
 for(const e of KB){let c=0;for(const x of qs){const m=x.match(new RegExp(e.k.source,'gi'));if(m)c=Math.max(c,m.length)}if(c>n){n=c;best=e}}
 const words=q.trim().split(/\s+/).length;
 if(best){const sure=(n>=2||words<=6)&&!!best[lang];return{txt:best[lang]||best.en,u:best.u,conf:!API_URL||sure}}
 return{txt:t('none'),u:unitFor(q),miss:true,conf:false}}
function hand(u){if(u)add(t('hand')+UNITS[u][lang],'bot hand')}
function ui(){document.documentElement.lang=lang;document.documentElement.dir=lang=='en'?'ltr':'rtl';$('h1').textContent=t('h1');$('h2').textContent=t('h2');$('q').placeholder=t('ph');$('clip').title=t('att');$('clip').setAttribute('aria-label',t('att'));$('go').textContent=t('go');
 $('chips').innerHTML='';t('chips').forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.onclick=()=>ask(c);$('chips').appendChild(b)})}
$('lg').onchange=e=>{lang=e.target.value;ui();$('log').innerHTML='';hist=[];add(t('hi'),'bot')};

/* ===== attachments ===== */
let files=[],imgCaps=null;const wmsg=(w)=>w=='busy'?t('wrate'):t('wnone');
const TXT=/\.(txt|md|csv|json|log|tsv)$/i,MAXT=60000,MAXI=8*1024*1024;
$('clip').textContent='📎';
function renderAtt(){const a=$('att');a.innerHTML='';files.forEach((f,i)=>{const d=document.createElement('div');d.className='at';
 if(f.img){const im=document.createElement('img');im.src=f.url;im.alt='';d.appendChild(im)}
 const n=document.createElement('span');n.textContent=f.file.name;d.appendChild(n);
 const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Remove');x.onclick=()=>{if(f.url)URL.revokeObjectURL(f.url);files.splice(i,1);renderAtt()};d.appendChild(x);a.appendChild(d)})}
async function addFiles(list){
 imgCaps=API_URL?{maxCount:3,maxInputBytes:8*1024*1024,mediaTypes:['image/jpeg','image/png','image/webp','image/gif']}:null;
 for(const f of list){
  const img=/^image\//.test(f.type);
  if(img){if(!imgCaps){add(t('wnone'),'bot');continue}
   if(imgCaps.mediaTypes&&!imgCaps.mediaTypes.includes(f.type)){add(t('noatt'),'bot');continue}
   if(f.size>Math.min(MAXI,imgCaps.maxInputBytes||MAXI)){add(t('attbig')+f.name,'bot');continue}
   if(files.filter(x=>x.img).length>=(imgCaps.maxCount||3)){continue}
   files.push({file:f,img:true,url:URL.createObjectURL(f)})}
  else if(TXT.test(f.name)||/^text\//.test(f.type)){
   if(f.size>MAXT*2){add(t('attbig')+f.name,'bot');continue}
   files.push({file:f,img:false,text:(await f.text()).slice(0,MAXT)})}
  else add(t('noatt'),'bot')}
 renderAtt()}
$('clip').onclick=()=>$('fi').click();
$('fi').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('q').addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs)}});
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',.8).split(',')[1]})};im.onerror=()=>rej(0);im.src=url})}
async function ask(q){q=(q||'').trim();const fl=files.slice();if((!q&&!fl.length)||busy)return;busy=true;$('q').value='';files=[];renderAtt();
 if(!q)q={en:'Please look at the attached file.',ar:'يرجى الاطلاع على الملف المرفق.',ku:'تکایە سەیری فایلە هاوپێچکراوەکە بکە.'}[lang];
 const me=add('','me');fl.forEach(f=>{if(f.img){const im=document.createElement('img');im.className='th';im.src=f.url;im.alt=f.file.name;me.appendChild(im)}else{const c=document.createElement('span');c.className='fl';c.textContent='📄 '+f.file.name;me.appendChild(c)}});me.appendChild(document.createTextNode(q));
 const tx=fl.filter(f=>!f.img).map(f=>'\n\n[Attached file: '+f.file.name+']\n'+f.text).join('');
 hist.push({role:'user',content:q+(fl.length?' [attached: '+fl.map(f=>f.file.name).join(', ')+']':'')});
 const w=add('','bot');w.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';let out=null,u=null,why=null;
 const L0=local(q);
 if(!fl.length&&L0.conf){out=L0.txt;u=L0.u}
 else if(API_URL){try{
  const imgs=await Promise.all(fl.filter(f=>f.img).map(f=>shrink(f.file)));
  const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),30000);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,body:JSON.stringify({lang,messages:hist.slice(-8),images:imgs,files:fl.filter(f=>!f.img).map(f=>({name:f.file.name,text:f.text}))})});
  clearTimeout(to);if(!r.ok){why=r.status==429?'busy':'err';throw 0}
  const j=await r.json();if(j&&j.text){out=j.text;u=UNITS[j.unit]?j.unit:null}
 }catch(e){if(!why)why='err'}}
 else if(fl.length)why='noapi';
 if(!out){if(fl.length){out=wmsg(why);u=null}else{out=L0.txt;u=L0.u}}
 w.textContent=out;hist.push({role:'assistant',content:out});hand(u);busy=false;$('log').scrollTop=1e9}
$('f').onsubmit=e=>{e.preventDefault();ask($('q').value)};
ui();add(t('hi'),'bot');
</script></body></html>
